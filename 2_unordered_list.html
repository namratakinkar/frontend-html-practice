
<!DOCTYPE html>
<html>
<head>
    <title>Unordered List Variants</title>
</head>
<body>

    <h1>Multiple Variants of Unordered List</h1>

    <h2>1. Disc List</h2>
    <ul style="list-style-type: disc;">
        <li>Apple</li>
        <li>Mango</li>
        <li>Banana</li>
    </ul>

    <h2>2. Circle List</h2>
    <ul style="list-style-type: circle;">
        <li>Red</li>
        <li>Green</li>
        <li>Blue</li>
    </ul>

    <h2>3. Square List</h2>
    <ul style="list-style-type: square;">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>4. Without Bullet List</h2>
    <ul style="list-style-type: none;">
        <li>Monday</li>
        <li>Tuesday</li>
        <li>Wednesday</li>
    </ul>

</body>
</html>
